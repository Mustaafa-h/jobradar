services:
  postgres:
    image: postgres:17-alpine
    container_name: jobradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: jobradar-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jobradar:${POSTGRES_PASSWORD}@postgres:5432/jobradar?schema=public
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_SESSION_PATH: /app/data/telegram/main-account
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - telegram_session_data:/app/data/telegram
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  telegram_session_data: