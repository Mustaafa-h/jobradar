services:
  postgres:
    image: postgres:17-alpine
    container_name: jobradar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jobradar
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: jobradar-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://jobradar:${POSTGRES_PASSWORD}@postgres:5432/jobradar?schema=public
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_DIGEST_CHAT_ID: ${TELEGRAM_DIGEST_CHAT_ID}
      CHECK_TRIGGER_TOKEN: ${CHECK_TRIGGER_TOKEN}
      TELEGRAM_SESSION_PATH: /app/data/telegram/main-account
      TELEGRAM_CHANNELS_CONFIG_PATH: /app/config/channels.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - telegram_session_data:/app/data/telegram
      - ./config/channels.json:/app/config/channels.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:2.34.5
    container_name: jobradar-n8n
    restart: unless-stopped
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      CHECK_TRIGGER_TOKEN: ${CHECK_TRIGGER_TOKEN}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      GENERIC_TIMEZONE: Asia/Baghdad
      TZ: Asia/Baghdad
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - backend

volumes:
  postgres_data:
  telegram_session_data:
  n8n_data: